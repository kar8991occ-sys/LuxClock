
name: Build LuxClock APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q LuxClock-Android-Project.zip -d extracted
              - name: Fix widget description
        run: |
          python3 -c "from pathlib import Path; import re; p=Path('extracted/LuxClock/app/src/main/res/xml/lux_clock_widget_info.xml'); s=p.read_text(); s=re.sub(r'\s*android:description=\"[^\"]*\"', '', s); p.write_text(s)"

      - name: Build APK
        run: |
          cd extracted/LuxClock
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LuxClock-APK
          path: extracted/LuxClock/app/build/outputs/apk/debug/app-debug.apk

